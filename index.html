  function showEmptyCanvasHint() {
    if (!scriptCanvas.querySelector('.script-block-item')) {
      scriptCanvas.innerHTML = '<div class="script-canvas-empty">Drop blocks here to build a script.</div>';
    }
  }

  function makeScriptCanvasDroppable(canvasEl) {
    canvasEl.addEventListener('dragenter', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });
    canvasEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const dropTarget = e.target.closest('.script-canvas');
      if (dropTarget !== canvasEl) return;
      canvasEl.classList.add('drag-over');
    });
    canvasEl.addEventListener('dragleave', (e) => {
      e.stopPropagation();
      canvasEl.classList.remove('drag-over');
    });
    canvasEl.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const dropTarget = e.target.closest('.script-canvas');
      if (dropTarget !== canvasEl) return;
      canvasEl.classList.remove('drag-over');
      const type = e.dataTransfer.getData('block-type');
      const commandText = e.dataTransfer.getData('text/plain');

      if (draggedScriptBlock) {
        const block = draggedScriptBlock;
        draggedScriptBlock = null;
        const oldParent = block.parentElement;
        if (oldParent) {
          block.remove();
          if (!oldParent.querySelector('.script-block-item')) {
            oldParent.innerHTML = '<div class="script-canvas-empty">Drop blocks here.</div>';
          }
        }
        insertBlockIntoCanvas(canvasEl, block);
        return;
      }

      if (!type && !commandText) return;
      if (type === 'command') {
        const block = createScriptBlock('command', commandText || '');
        insertBlockIntoCanvas(canvasEl, block);
      } else if (type) {
        const block = createScriptBlock(type);
        insertBlockIntoCanvas(canvasEl, block);
      } else if (commandText) {
        const block = createScriptBlock('command', commandText);
        insertBlockIntoCanvas(canvasEl, block);
      }
    });
  }

  function insertBlockIntoCanvas(canvasEl, block) {
    const emptyHint = canvasEl.querySelector('.script-canvas-empty');
    if (emptyHint) emptyHint.remove();
    canvasEl.appendChild(block);
  }

  function setBlockDragHandlers(block) {
    block.addEventListener('dragstart', (e) => {
      draggedScriptBlock = block;
      e.dataTransfer.setData('block-type', block.dataset.type);
      if (block.dataset.type === 'command') {
        const cmd = block.querySelector('textarea');
        if (cmd) e.dataTransfer.setData('text/plain', cmd.value);
      }
      e.dataTransfer.effectAllowed = 'move';
    });
    block.addEventListener('dragend', () => {
      draggedScriptBlock = null;
    });
  }

  function parseDelayValue(text) {
    const normalized = String(text).trim().toLowerCase();
    if (!normalized) return NaN;
    if (normalized.endsWith('us')) return parseFloat(normalized.slice(0, -2)) * 0.001;
    if (normalized.endsWith('ms')) return parseFloat(normalized.slice(0, -2));
    if (normalized.endsWith('s')) return parseFloat(normalized.slice(0, -1)) * 1000;
    return parseFloat(normalized) * 1000;
  }

  function normalizeScriptValue(value) {
    return String(value).replace(/\r/g, '').trim();
  }

  function busyWait(ms) {
    const start = performance.now();
    while (performance.now() - start < ms) {
      // busy loop for sub-millisecond wait
    }
  }

  function delay(ms) {
    if (ms <= 0) return Promise.resolve();
    const whole = Math.floor(ms);
    const fraction = ms - whole;
    return new Promise((resolve) => {
      if (whole > 0) {
        setTimeout(() => {
          if (fraction > 0) busyWait(fraction);
          resolve();
        }, whole);
      } else {
        busyWait(fraction);
        resolve();
      }
    });
  }

  function parseScriptCanvas(canvasEl) {
    const blocks = [];
    for (const child of canvasEl.children) {
      if (!child.classList.contains('script-block-item')) continue;
      const type = child.dataset.type;
      if (type === 'command') {
        const cmd = child.querySelector('textarea').value.trim();
        if (!cmd) continue;
        blocks.push({ type: 'command', command: cmd, element: child });
      } else if (type === 'delay') {
        const raw = child.querySelector('input').value;
        const ms = parseDelayValue(raw);
        if (Number.isNaN(ms) || ms < 0) continue;
        blocks.push({ type: 'delay', ms, element: child });
      } else if (type === 'read') {
        const source = child.querySelector('.read-source')?.value || 'uart';
        const variable = child.querySelector('.read-variable')?.value.trim();
        const command = child.querySelector('.read-command')?.value.trim();
        const keyword = child.querySelector('.read-keyword')?.value || '';
        const position = child.querySelector('.read-position')?.value || 'before';
        const length = parseInt(child.querySelector('.read-length')?.value, 10) || 0;
        const datatype = child.querySelector('.read-datatype')?.value || 'text';
        blocks.push({ type: 'read', source, variable, command, keyword, position, length, datatype, element: child });
      } else if (type === 'print') {
        const template = child.querySelector('.print-template')?.value || '';
        blocks.push({ type: 'print', template, element: child });
      } else if (type === 'condition') {
        const variable = child.querySelector('.condition-variable')?.value.trim();
        const operator = child.querySelector('.condition-operator')?.value || '=';
        const compare = child.querySelector('.condition-compare')?.value ?? '';
        const conditionMode = child.querySelector('.condition-mode')?.value || 'text-exact';
        const thenCanvas = child.querySelector('[data-branch="then"]');
        const elseCanvas = child.querySelector('[data-branch="else"]');
        const thenActions = thenCanvas ? parseScriptCanvas(thenCanvas) : [];
        const elseActions = elseCanvas ? parseScriptCanvas(elseCanvas) : [];
        blocks.push({ type: 'condition', variable, operator, compare, conditionMode, thenActions, elseActions, element: child });
      } else if (type === 'repeat') {
        const repeatInput = child.querySelector('input[type="number"]');
        const rawCount = repeatInput ? repeatInput.value : child.querySelector('input')?.value;
        const count = Math.max(1, Number(rawCount) || 1);
        const nested = child.querySelector('[data-nested]');
        const nestedActions = nested ? parseScriptCanvas(nested) : [];
        if (nestedActions.length === 0) continue;
        blocks.push({ type: 'repeat', count, actions: nestedActions, element: child });
      } else if (type === 'setvar') {
        const name = child.querySelector('.setvar-name')?.value.trim() || '';
        const value = child.querySelector('.setvar-value')?.value || '';
        blocks.push({ type: 'setvar', name, value, element: child });
      } else if (type === 'waitfor') {
        const keyword = child.querySelector('.waitfor-keyword')?.value || '';
        const tStr = child.querySelector('.waitfor-timeout')?.value;
        const timeout = (tStr !== undefined && tStr !== '') ? parseInt(tStr, 10) : 5000;
        blocks.push({ type: 'waitfor', keyword, timeout, element: child });
      } else if (type === 'math') {
        const result = child.querySelector('.math-result')?.value.trim() || '';
        const left = child.querySelector('.math-left')?.value || '';
        const operator = child.querySelector('.math-operator')?.value || '+';
        const right = child.querySelector('.math-right')?.value || '';
        blocks.push({ type: 'math', result, left, operator, right, element: child });
      }
    }
    return blocks;
  }

  function setActionRunning(action, running) {
    if (action.element) {
      action.element.classList.toggle('running', running);
    }
  }

  async function executeScriptActions(actions, vars = {}) {
    for (const action of actions) {
      if (stopScriptRequested) throw new Error('Script stopped');
      setActionRunning(action, true);
      try {
        if (action.type === 'command') {
          if (currentMode === 'adb') {
            if (!isAdbConnected) throw new Error('ADB not connected');
            await runAdbCommand(action.command);
          } else {
            if (!isConnected || !writer) throw new Error('Serial not connected');
            addToHistory(action.command);
            appendOutput(`\n> ${action.command}\n`);
            await sendRawData(action.command + '\r\n');
          }
        } else if (action.type === 'delay') {
          updateScriptStatus(`Waiting ${action.ms / 1000}s...`);
          await delay(action.ms);
        } else if (action.type === 'read') {
          const variable = action.variable || `var_${Math.floor(Math.random() * 1000)}`;
          const source = action.source || 'uart';
          const command = action.command || '';
          const keyword = action.keyword || '';
          const position = action.position || 'before';
          const length = Math.max(0, Number(action.length) || 0);
          let value = '';
          updateScriptStatus(`Reading ${source} into ${variable}...`);
          if (source === 'adb') {
            if (!isAdbConnected) throw new Error('ADB not connected');
            value = await runAdbCommand(command || '');
          } else {
            if (!isConnected || !writer) throw new Error('Serial not connected');
            const before = ta.value;
            if (command) {
              addToHistory(command);
              appendOutput(`\n> ${command}\n`);
              await sendRawData(command + '\r\n');
            }
            await delay(250);
            const after = ta.value;
            value = after.slice(before.length);
          }
          value = normalizeScriptValue(value);
          if (keyword && length > 0) {
            const idx = value.indexOf(keyword);
            if (idx >= 0) {
              if (position === 'before') {
                const end = idx;
                const start = Math.max(0, end - length);
                value = value.slice(start, end);
              } else {
                const start = idx + keyword.length;
                value = value.slice(start, start + length);
              }
            } else {
              value = '';
            }
          }
          // Apply data type conversion
          const datatype = action.datatype || 'text';
          if (datatype === 'hex') {
            // Parse as hex number, store decimal string
            const parsed = parseInt(value.trim(), 16);
            value = Number.isNaN(parsed) ? value : String(parsed);
          } else if (datatype === 'dec') {
            // Parse as decimal number, store decimal string
            const parsed = parseFloat(value.trim());
            value = Number.isNaN(parsed) ? value : String(parsed);
          }
          // else 'text': keep as-is
          vars[variable] = value;
          if (action.element) {
            const debugLabel = action.element.querySelector('.read-value');
            if (debugLabel) {
              const typeLabel = datatype === 'hex' ? ' [Hex→Dec]' : datatype === 'dec' ? ' [Dec]' : ' [Text]';
              debugLabel.textContent = `Value: ${value}${typeLabel}`;
            }
          }
        } else if (action.type === 'print') {
          const template = action.template || '';
          const output = template.replace(/\$\{(\w+)\}/g, (_, name) => vars[name] ?? '');
          appendOutput(`\n${output}\n`);
          updateScriptStatus('Print output');
        } else if (action.type === 'condition') {
          const variable = action.variable || '';
          const operator = action.operator || '=';
          const compare = normalizeScriptValue(action.compare ?? '');
          const left = normalizeScriptValue(vars[variable] ?? '');
          const condMode = action.conditionMode || 'text-exact';
          let result = false;

          if (condMode === 'text-exact') {
            // Text exact match
            if (operator === '=') result = left === compare;
            else if (operator === '!=') result = left !== compare;
          } else if (condMode === 'text-contains') {
            // Text partial match (substring)
            if (operator === 'contains') result = left.includes(compare);
            else if (operator === 'not-contains') result = !left.includes(compare);
          } else if (condMode === 'hex') {
            // Hex number comparison: parse both as hex
            const leftNum = parseInt(left.trim(), 16);
            const rightNum = parseInt(compare.trim(), 16);
            if (!Number.isNaN(leftNum) && !Number.isNaN(rightNum)) {
              if (operator === '=') result = leftNum === rightNum;
              else if (operator === '!=') result = leftNum !== rightNum;
              else if (operator === '<') result = leftNum < rightNum;
              else if (operator === '>') result = leftNum > rightNum;
            }
          } else if (condMode === 'dec') {
            // Decimal number comparison
            const leftNum = parseFloat(left.trim());
            const rightNum = parseFloat(compare.trim());
            if (!Number.isNaN(leftNum) && !Number.isNaN(rightNum)) {
              if (operator === '=') result = leftNum === rightNum;
              else if (operator === '!=') result = leftNum !== rightNum;
              else if (operator === '<') result = leftNum < rightNum;
              else if (operator === '>') result = leftNum > rightNum;
            }
          }
          const modeLabel = {"text-exact": "Text Exact", "text-contains": "Text Contains", "hex": "Hex Number", "dec": "Dec Number"}[condMode] || condMode;
          updateScriptStatus(`IF [${modeLabel}] ${variable} ${operator} ${compare} => ${result}`);
          await executeScriptActions(result ? action.thenActions : action.elseActions, vars);
        } else if (action.type === 'repeat') {
          const loopCount = Math.max(1, Number(action.count) || 1);
          updateScriptStatus(`Repeating ${loopCount}×`);
          for (let i = 0; i < loopCount; i++) {
            if (stopScriptRequested) throw new Error('Script stopped');
            await executeScriptActions(action.actions, vars);
          }
        } else if (action.type === 'setvar') {
          const name = action.name || '';
          const rawValue = action.value || '';
          const resolved = rawValue.replace(/\$\{(\w+)\}/g, (_, v) => vars[v] ?? '');
          vars[name] = resolved;
          updateScriptStatus(`Set ${name} = ${resolved}`);
        } else if (action.type === 'waitfor') {
          const keyword = action.keyword || '';
          const timeout = action.timeout !== undefined ? Math.max(0, Number(action.timeout)) : 5000;
          if (!keyword) { updateScriptStatus('Wait For: no keyword'); }
          else {
            updateScriptStatus(`Waiting for "${keyword}"...`);
            const startTime = Date.now();
            const startLen = ta.value.length;
            let found = false;
            while (!found) {
              if (stopScriptRequested) throw new Error('Script stopped');
              if (timeout > 0 && (Date.now() - startTime) >= timeout) break;
              const newContent = ta.value.slice(startLen);
              if (newContent.includes(keyword)) { found = true; break; }
              await delay(100);
            }
            if (action.element) {
              const dbg = action.element.querySelector('.waitfor-result');
              if (dbg) dbg.textContent = found ? `Found "${keyword}" (${Date.now() - startTime}ms)` : `Timeout (${timeout}ms)`;
            }
            updateScriptStatus(found ? `Found "${keyword}"` : `Wait For timeout (${timeout}ms)`);
          }
        } else if (action.type === 'math') {
          const resultVar = action.result || '';
          const rawLeft = (action.left || '').replace(/\$\{(\w+)\}/g, (_, v) => vars[v] ?? '0');
          const rawRight = (action.right || '').replace(/\$\{(\w+)\}/g, (_, v) => vars[v] ?? '0');
          const l = parseFloat(rawLeft) || 0;
          const r = parseFloat(rawRight) || 0;
          const op = action.operator || '+';
          let res = 0;
          if (op === '+') res = l + r;
          else if (op === '-') res = l - r;
          else if (op === '*') res = l * r;
          else if (op === '/') res = r !== 0 ? l / r : 0;
          else if (op === '%') res = r !== 0 ? l % r : 0;
          vars[resultVar] = String(res);
          if (action.element) {
            const dbg = action.element.querySelector('.math-debug');
            if (dbg) dbg.textContent = `${resultVar} = ${l} ${op} ${r} = ${res}`;
          }
          updateScriptStatus(`Math: ${resultVar} = ${res}`);
        }
      } finally {
        setActionRunning(action, false);
      }
    }
  }

  runScriptBtn.addEventListener('click', async () => {
    const actions = parseScriptCanvas(scriptCanvas);
    if (actions.length === 0) {
      updateScriptStatus('Add blocks first.');
      return;
    }
    stopScriptRequested = false;
    runScriptBtn.disabled = true;
    stopScriptBtn.disabled = false;
    updateScriptStatus('Running...');
    try {
      await executeScriptActions(actions, {});
      if (!stopScriptRequested) updateScriptStatus('Completed.');
    } catch (err) {
      updateScriptStatus(err.message || 'Error during run.');
    } finally {
      stopScriptRequested = false;
      runScriptBtn.disabled = false;
      stopScriptBtn.disabled = true;
    }
  });

  stopScriptBtn.addEventListener('click', () => {
    stopScriptRequested = true;
    updateScriptStatus('Stopping...');
  });

  // ── Script Export / Import ──

  function serializeCanvasToJSON(canvasEl) {
    const blocks = [];
    for (const child of canvasEl.children) {
      if (!child.classList.contains('script-block-item')) continue;
      const type = child.dataset.type;
      if (type === 'command') {
        const cmd = child.querySelector('textarea')?.value || '';
        blocks.push({ type: 'command', command: cmd });
      } else if (type === 'delay') {
        const val = child.querySelector('input')?.value || '0.100s';
        blocks.push({ type: 'delay', value: val });
      } else if (type === 'read') {
        blocks.push({
          type: 'read',
          source: child.querySelector('.read-source')?.value || 'uart',
          variable: child.querySelector('.read-variable')?.value || '',
          command: child.querySelector('.read-command')?.value || '',
          keyword: child.querySelector('.read-keyword')?.value || '',
          position: child.querySelector('.read-position')?.value || 'before',
          length: parseInt(child.querySelector('.read-length')?.value, 10) || 0,
          datatype: child.querySelector('.read-datatype')?.value || 'text'
        });
      } else if (type === 'print') {
        blocks.push({
          type: 'print',
          template: child.querySelector('.print-template')?.value || ''
        });
      } else if (type === 'condition') {
        const thenCanvas = child.querySelector('[data-branch="then"]');
        const elseCanvas = child.querySelector('[data-branch="else"]');
        blocks.push({
          type: 'condition',
          mode: child.querySelector('.condition-mode')?.value || 'text-exact',
          variable: child.querySelector('.condition-variable')?.value || '',
          operator: child.querySelector('.condition-operator')?.value || '=',
          compare: child.querySelector('.condition-compare')?.value || '',
          then: thenCanvas ? serializeCanvasToJSON(thenCanvas) : [],
          else: elseCanvas ? serializeCanvasToJSON(elseCanvas) : []
        });
      } else if (type === 'repeat') {
        const repeatInput = child.querySelector('input[type="number"]');
        const count = parseInt(repeatInput?.value, 10) || 2;
        const nested = child.querySelector('[data-nested]');
        blocks.push({
          type: 'repeat',
          count: count,
          actions: nested ? serializeCanvasToJSON(nested) : []
        });
      } else if (type === 'setvar') {
        blocks.push({
          type: 'setvar',
          name: child.querySelector('.setvar-name')?.value || '',
          value: child.querySelector('.setvar-value')?.value || ''
        });
      } else if (type === 'waitfor') {
        const tStr = child.querySelector('.waitfor-timeout')?.value;
        blocks.push({
          type: 'waitfor',
          keyword: child.querySelector('.waitfor-keyword')?.value || '',
          timeout: (tStr !== undefined && tStr !== '') ? parseInt(tStr, 10) : 5000
        });
      } else if (type === 'math') {
        blocks.push({
          type: 'math',
          result: child.querySelector('.math-result')?.value || '',
          left: child.querySelector('.math-left')?.value || '',
          operator: child.querySelector('.math-operator')?.value || '+',
          right: child.querySelector('.math-right')?.value || ''
        });
      }
    }
    return blocks;
  }

  function importBlocksToCanvas(canvasEl, blocks) {
    for (const b of blocks) {
      let block;
      if (b.type === 'command') {
        block = createScriptBlock('command', b.command || '');
      } else if (b.type === 'delay') {
        block = createScriptBlock('delay', b.value || '0.100s');
      } else if (b.type === 'read') {
        block = createScriptBlock('read', b.command || '');
        const el = block;
        if (b.source) { const s = el.querySelector('.read-source'); if (s) s.value = b.source; }
        if (b.variable) { const v = el.querySelector('.read-variable'); if (v) v.value = b.variable; }
        if (b.keyword) { const k = el.querySelector('.read-keyword'); if (k) k.value = b.keyword; }
        if (b.position) { const p = el.querySelector('.read-position'); if (p) p.value = b.position; }
        if (b.length) { const l = el.querySelector('.read-length'); if (l) l.value = b.length; }
        if (b.datatype) { const d = el.querySelector('.read-datatype'); if (d) d.value = b.datatype; }
      } else if (b.type === 'print') {
        block = createScriptBlock('print');
        const tmpl = block.querySelector('.print-template');
        if (tmpl) tmpl.value = b.template || '';
      } else if (b.type === 'condition') {
        block = createScriptBlock('condition');
        const modeSel = block.querySelector('.condition-mode');
        if (modeSel && b.mode) { modeSel.value = b.mode; modeSel.dispatchEvent(new Event('change')); }
        const varIn = block.querySelector('.condition-variable');
        if (varIn && b.variable) varIn.value = b.variable;
        const opSel = block.querySelector('.condition-operator');
        if (opSel && b.operator) opSel.value = b.operator;
        const cmpIn = block.querySelector('.condition-compare');
        if (cmpIn && b.compare) cmpIn.value = b.compare;
        if (b.then && b.then.length > 0) {
          const thenCanvas = block.querySelector('[data-branch="then"]');
          if (thenCanvas) { thenCanvas.innerHTML = ''; importBlocksToCanvas(thenCanvas, b.then); }
        }
        if (b.else && b.else.length > 0) {
          const elseCanvas = block.querySelector('[data-branch="else"]');
          if (elseCanvas) { elseCanvas.innerHTML = ''; importBlocksToCanvas(elseCanvas, b.else); }
        }
      } else if (b.type === 'repeat') {
        block = createScriptBlock('repeat');
        const countIn = block.querySelector('input[type="number"]');
        if (countIn) countIn.value = b.count || 2;
        if (b.actions && b.actions.length > 0) {
          const nested = block.querySelector('[data-nested]');
          if (nested) { nested.innerHTML = ''; importBlocksToCanvas(nested, b.actions); }
        }
      } else if (b.type === 'setvar') {
        block = createScriptBlock('setvar');
        const nameIn = block.querySelector('.setvar-name');
        if (nameIn && b.name) nameIn.value = b.name;
        const valIn = block.querySelector('.setvar-value');
        if (valIn && b.value) valIn.value = b.value;
      } else if (b.type === 'waitfor') {
        block = createScriptBlock('waitfor');
        const kwIn = block.querySelector('.waitfor-keyword');
        if (kwIn && b.keyword) kwIn.value = b.keyword;
        const toIn = block.querySelector('.waitfor-timeout');
        if (toIn) toIn.value = b.timeout || 5000;
      } else if (b.type === 'math') {
        block = createScriptBlock('math');
        const rIn = block.querySelector('.math-result');
        if (rIn && b.result) rIn.value = b.result;
        const lIn = block.querySelector('.math-left');
        if (lIn && b.left) lIn.value = b.left;
        const opSel = block.querySelector('.math-operator');
        if (opSel && b.operator) opSel.value = b.operator;
        const riIn = block.querySelector('.math-right');
        if (riIn && b.right) riIn.value = b.right;
      }
      if (block) insertBlockIntoCanvas(canvasEl, block);
    }
  }

  document.getElementById('exportScriptBtn').addEventListener('click', () => {
    const blocks = serializeCanvasToJSON(scriptCanvas);
    if (blocks.length === 0) {
      updateScriptStatus('Nothing to export.');
      return;
    }
    const json = JSON.stringify({ version: 1, name: 'Untitled Script', blocks }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'script.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    updateScriptStatus('Script exported.');
  });

  document.getElementById('importScriptBtn').addEventListener('click', () => {
    document.getElementById('importScriptFile').click();
  });

  document.getElementById('importScriptFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.blocks || !Array.isArray(data.blocks)) {
          updateScriptStatus('Invalid script file: missing blocks array.');
          return;
        }
        // Clear canvas
        scriptCanvas.innerHTML = '';
        importBlocksToCanvas(scriptCanvas, data.blocks);
        if (!scriptCanvas.querySelector('.script-block-item')) showEmptyCanvasHint();
        updateScriptStatus(`Imported: ${data.name || 'script'} (${data.blocks.length} blocks)`);
      } catch (err) {
        updateScriptStatus('Import error: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.querySelectorAll('.script-block').forEach(btn => {
    btn.addEventListener('dragstart', (e) => {
      const blockType = btn.dataset.blockType;
      if (blockType) {
        e.dataTransfer.setData('block-type', blockType);
      }
      e.dataTransfer.effectAllowed = 'copy';
    });
  });

  makeScriptCanvasDroppable(scriptCanvas);
  showEmptyCanvasHint();

  // ── Shared save / clear ──
  document.getElementById('saveButton').addEventListener('click', () => {
    const text = getBaseText();
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([text], { type: 'text/plain' })),
      download: currentMode === 'adb' ? 'adb_output.txt' : 'serial_output.txt'
    });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  document.getElementById('clearButton').addEventListener('click', () => {
    ta.value = '';
    inputBuffer = ''; historyIndex = -1;
  });

  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    saveHistory([]); renderHistory();
  });

  renderHistory();
});
</script>
</body>
</html>
